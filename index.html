<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<meta name="description" content="單檔網頁遊戲合集 —— 零依賴、離線可用">
<style>
  :root{
    --radius:14px; --maxw:1100px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0a1b13; --bg2:#0e241a; --panel:#12291e; --panel2:#173324;
    --text:#e8f0ea; --muted:#93ab9c; --accent:#ffd54f; --accent2:#1b5e20;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.20);
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f7f4; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f5f1;
    --text:#152a1f; --muted:#5c7266; --accent:#1b7a3f; --accent2:#e4f2e8;
    --border:rgba(0,0,0,.10); --border2:rgba(0,0,0,.20);
    --shadow:0 8px 24px rgba(0,0,0,.08);
  }
  html[data-theme="ocean"]{
    --bg:#061a2b; --bg2:#0a2337; --panel:#0d2b42; --panel2:#123850;
    --text:#e6f2fb; --muted:#8fb2cc; --accent:#4fc3f7; --accent2:#0d3b57;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.22);
    --shadow:0 8px 24px rgba(0,0,0,.38);
  }
  html[data-theme="sunset"]{
    --bg:#241220; --bg2:#31182b; --panel:#3b1c2b; --panel2:#4a2434;
    --text:#fdeef3; --muted:#c3a0af; --accent:#ff8a65; --accent2:#5b2b3d;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.22);
    --shadow:0 8px 24px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg2); border-bottom:1px solid var(--border);
    backdrop-filter:saturate(140%) blur(8px);
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;width:100%;}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:1.5px;color:var(--accent);}
  .brand span{font-size:12.5px;color:var(--muted);}

  .themes{display:flex;gap:6px;}
  .theme{
    background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  .theme:hover{border-color:var(--border2);color:var(--text);}
  .theme[aria-pressed="true"]{background:var(--accent);color:var(--accent2);border-color:var(--accent);font-weight:700;}

  .search{
    display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:7px 12px; min-width:220px;
  }
  .search input{
    background:transparent;border:0;outline:0;color:var(--text);
    font-family:inherit;font-size:13.5px;width:100%;
  }
  .search input::placeholder{color:var(--muted);}

  main{flex:1;padding:26px 0 40px;}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;
        font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
  .card{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--card-accent,var(--accent));
    border-radius:var(--radius);padding:18px;transition:.18s;box-shadow:var(--shadow);
  }
  .card:hover{transform:translateY(-3px);border-color:var(--border2);
              border-left-color:var(--card-accent,var(--accent));}
  .card .top{display:flex;align-items:center;gap:12px;}
  .card .ico{font-size:26px;line-height:1;}
  .card h2{margin:0;font-size:16px;font-weight:700;}
  .card .zh{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px;}
  .card p{margin:0;font-size:13px;line-height:1.65;color:var(--muted);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:11.5px;color:var(--muted);background:var(--panel2);
       border:1px solid var(--border);border-radius:999px;padding:2px 9px;}
  .card .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--card-accent,var(--accent));
            display:flex;align-items:center;gap:6px;}

  .empty{
    text-align:center;padding:52px 20px;border:1px dashed var(--border2);
    border-radius:var(--radius);color:var(--muted);
  }
  .empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;}

  .hint{
    margin-top:26px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.7;
  }
  .hint b{color:var(--text);}
  .hint code{background:var(--panel2);border:1px solid var(--border);border-radius:6px;
             padding:1px 6px;font-size:12.5px;}
  footer{border-top:1px solid var(--border);padding:16px 0;font-size:12px;color:var(--muted);}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1 id="siteTitle">Games</h1>
        <span id="siteSub">單檔網頁遊戲合集 · 零依賴 · 離線可用</span>
      </div>
      <div class="themes" id="themes">
        <button class="theme" data-set="dark"   aria-pressed="true">深色</button>
        <button class="theme" data-set="light"  aria-pressed="false">淺色</button>
        <button class="theme" data-set="ocean"  aria-pressed="false">海洋</button>
        <button class="theme" data-set="sunset" aria-pressed="false">日落</button>
      </div>
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="搜尋遊戲 / 標籤…" autocomplete="off">
      </label>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="meta">
      <span id="count">載入中…</span>
      <span id="src"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <strong>搵唔到符合嘅遊戲</strong>
      <span>試下換個關鍵字，或者清空搜尋框。</span>
    </div>

    <div class="hint">
      <b>加新遊戲（3 步）</b><br>
      1. 把單檔 HTML 丟落 repo 根目錄（例如 <code>ChessTrainer.html</code>）<br>
      2. 喺 <code>games.json</code> 嘅 <code>games</code> 陣列加一項（標題／中文名／描述／emoji／強調色／標籤）<br>
      3. <code>git push</code> → 約 30–60 秒後生效<br>
      <span style="opacity:.75">漏咗第 2 步都會自動顯示（由檔名推導標題），但補上 JSON 才會有中文名、描述同標籤。</span>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Games · 單檔、零依賴</span>
    <span id="repoLink"></span>
  </div>
</footer>

<script>
const OWNER = 'lsisan1212', REPO = 'Games';

const FALLBACK = {
  site: { title: 'Games', subtitle: '單檔網頁遊戲合集 · 零依賴 · 離線可用' },
  games: [
    { file: 'Rummuku.html', title: 'Rummikub', titleZh: '拉密',
      desc: '經典數字牌遊戲：2–4 人對戰、計時、出牌提示、牌池顯示。',
      emoji: '🀄', accent: '#ffd54f', tags: ['桌遊', '益智', '2-4 人'] }
  ]
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function prettyName(file) {
  return file.replace(/\.html?$/i, '')
             .replace(/[-_]+/g, ' ')
             .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
             .trim();
}

const state = { site: FALLBACK.site, games: [] };

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const list = state.games.filter(g => {
    if (!q) return true;
    return [g.title, g.titleZh, g.desc, g.file, (g.tags || []).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });

  document.getElementById('count').textContent =
    q ? `顯示 ${list.length} / ${state.games.length} 個遊戲`
      : `共 ${state.games.length} 個遊戲`;
  document.getElementById('empty').hidden = list.length !== 0;

  grid.innerHTML = list.map(g => `
    <a class="card" href="${esc(g.file)}" style="--card-accent:${esc(g.accent || 'var(--accent)')}">
      <div class="top">
        <span class="ico" aria-hidden="true">${esc(g.emoji || '🎮')}</span>
        <h2>${esc(g.title)}${g.titleZh ? `<span class="zh">${esc(g.titleZh)}</span>` : ''}</h2>
      </div>
      ${g.desc ? `<p>${esc(g.desc)}</p>` : ''}
      ${(g.tags && g.tags.length) ? `<div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <span class="go">開始玩 →</span>
    </a>`).join('');
}

async function load() {
  let manifest = null;
  try {
    const r = await fetch('games.json', { cache: 'no-store' });
    if (r.ok) manifest = await r.json();
  } catch (e) { /* file:// 或 fetch 被擋 → 用 fallback */ }

  const base = (manifest && Array.isArray(manifest.games)) ? manifest : FALLBACK;
  state.site = base.site || FALLBACK.site;
  state.games = (base.games || []).slice();
  document.getElementById('src').textContent = manifest ? '' : '（離線模式：用內建清單）';

  document.title = state.site.title || 'Games';
  document.getElementById('siteTitle').textContent = state.site.title || 'Games';
  document.getElementById('siteSub').textContent = state.site.subtitle || '';
  render();

  try {
    const r2 = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents`, { cache: 'no-store' });
    if (r2.ok) {
      const files = await r2.json();
      const known = new Set(state.games.map(g => g.file));
      let added = 0;
      for (const f of files) {
        if (f.type !== 'file') continue;
        if (!/\.html?$/i.test(f.name)) continue;
        if (/^index\.html?$/i.test(f.name) || f.name.startsWith('_')) continue;
        if (known.has(f.name)) continue;
        state.games.push({ file: f.name, title: prettyName(f.name), emoji: '🎮',
                           desc: '（未加入 games.json，顯示為自動偵測）', tags: ['自動偵測'] });
        added++;
      }
      if (added) render();
    }
  } catch (e) { /* 離線 / 被擋，忽略 */ }
}

document.getElementById('q').addEventListener('input', render);

const THEME_KEY = 'games-theme';
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.set === t)));
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
document.getElementById('themes').addEventListener('click', e => {
  const b = e.target.closest('.theme');
  if (b) setTheme(b.dataset.set);
});
try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) setTheme(saved);
} catch (e) {}

document.getElementById('repoLink').innerHTML =
  `<a href="https://github.com/${OWNER}/${REPO}">github.com/${OWNER}/${REPO}</a>`;

load();
</script>
</body>
</html>
