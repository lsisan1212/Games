<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rummikub</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1e6b44,#0b2c1d 65%,#071a11);
    color:#eee;display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;
    background:rgba(0,0,0,.38);border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:5;
  }
  .brand{font-weight:900;letter-spacing:2px;color:#ffd54f;font-size:15px;}
  #players{display:flex;gap:8px;flex-wrap:wrap;}
  .p{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
     background:rgba(255,255,255,.07);font-size:13px;transition:.2s;}
  .p.current{background:#ffd54f;color:#1a1a1a;font-weight:700;
             box-shadow:0 0 14px rgba(255,213,79,.55);}
  .p .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .cnt{background:rgba(0,0,0,.25);border-radius:10px;padding:0 7px;font-size:12px;
       display:inline-flex;align-items:center;gap:3px;}
  .p.current .cnt{background:rgba(0,0,0,.14);}
  .cnt.turns{background:rgba(255,213,79,.18);color:#ffd54f;}
  .p.current .cnt.turns{background:rgba(0,0,0,.18);color:#1a1a1a;}
  .meld{color:#66bb6a;font-weight:800;}
  .p.current .meld{color:#1b5e20;}
  #timerInfo{font-size:13px;opacity:.95;white-space:nowrap;font-weight:700;
             color:#ffd54f;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:8px;
             border:1px solid rgba(255,213,79,.25);font-variant-numeric:tabular-nums;}
  #poolInfo{margin-left:auto;font-size:13px;opacity:.85;white-space:nowrap;}
  .mini{background:rgba(255,255,255,.12);color:#eee;border:1px solid rgba(255,255,255,.2);
        border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;transition:.15s;}
  .mini:hover{background:rgba(255,255,255,.22);}
  .mini.active{background:#ffd54f;color:#1a1a1a;border-color:#ffd54f;font-weight:700;}
  .mini.hintOn{background:#ffb300;color:#1a1a1a;border-color:#ffb300;font-weight:700;}

  /* ---------- table ---------- */
  #tableArea{
    flex:1;overflow:auto;padding:18px;display:flex;flex-wrap:wrap;
    gap:14px;align-content:flex-start;
  }
  #tableArea .empty{margin:auto;opacity:.35;font-size:15px;letter-spacing:1px;text-align:center;}
  .group{
    display:flex;gap:4px;padding:8px;border-radius:10px;
    background:rgba(255,255,255,.05);border:2px solid transparent;
    transition:background .15s,border-color .15s,box-shadow .15s;cursor:default;
  }
  .group.ok{border-color:rgba(255,255,255,.1);}
  .group.bad{border-color:#ef5350;background:rgba(239,83,80,.14);}
  .group.ok:hover{background:rgba(255,255,255,.13);}
  .group.hint{border-color:#ffd54f;box-shadow:0 0 16px rgba(255,213,79,.55);}

  /* ---------- tiles ---------- */
  .tile-wrap{position:relative;flex:0 0 auto;}
  .tile{
    width:42px;height:58px;border-radius:7px;background:#fbfbfb;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:22px;cursor:pointer;user-select:none;
    box-shadow:0 2px 5px rgba(0,0,0,.45);border:1px solid #cfcfcf;
    transition:transform .1s,box-shadow .1s,outline .1s;
  }
  .tile:hover{transform:translateY(-4px);box-shadow:0 6px 10px rgba(0,0,0,.5);}
  .tile.red{color:#d32f2f;}
  .tile.blue{color:#1565c0;}
  .tile.yellow{color:#f9a825;}
  .tile.black{color:#212121;}
  .tile.joker{
    background:linear-gradient(135deg,#ef5350,#ffa726,#66bb6a,#42a5f5);
    color:#fff;font-size:24px;text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .tile.selected{
    outline:3px solid #00e676;outline-offset:1px;
    transform:translateY(-8px);box-shadow:0 8px 14px rgba(0,0,0,.55);
  }
  .tile.hint{outline:3px dashed #ffd54f;outline-offset:1px;}
  .tile.dim{opacity:.5;cursor:default;}
  .tile.dim:hover{transform:none;box-shadow:0 2px 5px rgba(0,0,0,.45);}
  .tile-cross{
    position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;
    background:#e53935;color:#fff;font-size:12px;line-height:16px;text-align:center;
    font-weight:900;cursor:pointer;z-index:3;
    box-shadow:0 1px 4px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);
    transition:transform .12s,background .12s;user-select:none;
  }
  .tile-cross:hover{background:#ff1744;transform:scale(1.25);}
  .sep{width:2px;height:42px;background:rgba(255,255,255,.18);
       border-radius:1px;flex:0 0 auto;align-self:center;margin:0 4px;}

  /* ---------- hand ---------- */
  #handBar{background:rgba(0,0,0,.4);border-top:1px solid rgba(255,255,255,.1);padding:8px 14px 4px;}
  #handTop{display:flex;align-items:center;justify-content:space-between;
           gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  #handLabel{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;}
  #sortBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sortLbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.5;}
  #handArea{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;min-height:66px;}
  #handArea:empty::after{content:"—";opacity:.3;font-size:13px;}

  /* ---------- controls ---------- */
  #controls{display:flex;gap:10px;padding:10px 14px 14px;background:rgba(0,0,0,.4);flex-wrap:wrap;}
  #controls button{
    flex:1;min-width:105px;padding:11px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.1);color:#eee;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  #controls button:hover:not(:disabled){background:rgba(255,255,255,.22);}
  #controls button:disabled{opacity:.32;cursor:not-allowed;}
  #controls button.primary{background:#2e7d32;border-color:#43a047;}
  #controls button.primary:hover:not(:disabled){background:#388e3c;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:#c62828;color:#fff;padding:10px 20px;border-radius:9px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;
    transition:.25s;z-index:50;max-width:90vw;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.good{background:#2e7d32;}

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;
    align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);
    padding:16px;overflow:auto;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:#12331f;border:1px solid rgba(255,255,255,.15);border-radius:16px;
    padding:26px 30px;max-width:600px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:92vh;overflow:auto;
  }
  .modal h1{font-size:28px;letter-spacing:4px;color:#ffd54f;margin:0 0 4px;}
  .modal h2{margin:0 0 12px;color:#ffd54f;font-size:23px;}
  .modal p{margin:8px 0;font-size:14px;line-height:1.6;opacity:.92;text-align:left;}
  .modal ul{margin:8px 0;padding-left:20px;font-size:14px;line-height:1.65;text-align:left;}
  .modal li{margin:5px 0;}
  .modal table{margin:14px auto;border-collapse:collapse;font-size:14px;}
  .modal td{padding:5px 14px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;}
  .modal td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .modal button.primary{
    margin-top:16px;padding:12px 32px;border-radius:9px;border:none;
    background:#2e7d32;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
  .modal button.primary:hover{background:#388e3c;}
  .modal button.ghost{
    margin-top:10px;padding:9px 22px;border-radius:9px;
    background:transparent;color:#ffd54f;border:1px solid rgba(255,213,79,.5);
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .modal button.ghost:hover{background:rgba(255,213,79,.12);}
  .timeBig{
    font-size:32px;font-weight:900;color:#ffd54f;letter-spacing:2px;
    font-variant-numeric:tabular-nums;margin:6px 0 12px;
  }

  /* ---------- setup ---------- */
  .setup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .setup-head select{
    background:#0d2417;color:#eee;border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;
  }
  .field{margin:14px 0;text-align:left;}
  .field label{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
               opacity:.6;margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 14px;border-radius:9px;font-size:15px;
    background:#0d2417;color:#eee;border:1px solid rgba(255,255,255,.2);
  }
  .field input:focus{outline:none;border-color:#ffd54f;}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px;}
  @media(max-width:520px){.modes{grid-template-columns:1fr;}}
  .modeBtn{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 10px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;
    background:rgba(255,255,255,.07);color:#eee;border:2px solid rgba(255,255,255,.12);
    transition:.18s;
  }
  .modeBtn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px);}
  .modeBtn.sel{border-color:#ffd54f;background:rgba(255,213,79,.15);}
  .modeIcon{font-size:26px;line-height:1;}
  .lobby{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);}
  .lobby.hidden{display:none;}
  .lobby-actions{display:flex;gap:10px;}
  .lobby-actions button{
    flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.1);color:#eee;border:1px solid rgba(255,255,255,.2);
  }
  .lobby-actions button:hover{background:rgba(255,255,255,.22);}
  .joinBox{display:flex;gap:8px;margin-top:12px;}
  .joinBox input{
    flex:1;padding:11px 14px;border-radius:9px;font-size:17px;letter-spacing:4px;
    text-align:center;text-transform:uppercase;font-weight:800;
    background:#0d2417;color:#ffd54f;border:1px solid rgba(255,255,255,.2);
  }
  .codeRow{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap;}
  .codeLabel{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.6;}
  .code{
    font-size:26px;font-weight:900;letter-spacing:6px;color:#ffd54f;
    background:rgba(0,0,0,.35);padding:6px 14px;border-radius:9px;
    border:1px dashed rgba(255,213,79,.4);
  }
  .shareRow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
  .shareBtn{
    display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;
    font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;
    background:rgba(255,255,255,.1);color:#eee;border:1px solid rgba(255,255,255,.18);
    transition:.15s;
  }
  .shareBtn:hover{background:rgba(255,255,255,.24);}
  .lobbyPlayers{margin:14px 0;display:flex;flex-direction:column;gap:6px;}
  .lobbyPlayer{
    display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;
    background:rgba(255,255,255,.06);font-size:13px;
  }
  .lobbyPlayer .dot{width:9px;height:9px;border-radius:50%;}
  .statusMsg{margin-top:12px;font-size:13px;opacity:.8;min-height:18px;}
  .statusMsg.err{color:#ef5350;opacity:1;font-weight:600;}
  .statusMsg.ok{color:#66bb6a;opacity:1;font-weight:600;}

  #readyOverlay{z-index:90;}
  #readyOverlay .modal{max-width:380px;}

  #handArea::-webkit-scrollbar,#tableArea::-webkit-scrollbar{height:8px;width:8px;}
  #handArea::-webkit-scrollbar-thumb,#tableArea::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);border-radius:4px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">RUMMIKUB</div>
  <div id="players"></div>
  <div id="timerInfo">⏱ 00:00</div>
  <div id="poolInfo"></div>
  <button id="btnHints" class="mini" title="Hints">💡</button>
  <button id="btnRulesTop" class="mini" title="Rules">?</button>
  <button id="btnNew" class="mini" data-i18n="menu">Menu</button>
</div>

<div id="tableArea"></div>

<div id="handBar">
  <div id="handTop">
    <div id="handLabel"></div>
    <div id="sortBar">
      <span class="sortLbl" data-i18n="sort"></span>
      <button class="mini sortBtn active" data-mode="color" data-i18n="sortColor"></button>
      <button class="mini sortBtn" data-mode="number" data-i18n="sortNumber"></button>
      <button class="mini sortBtn" data-mode="group" data-i18n="sortGroup"></button>
    </div>
  </div>
  <div id="handArea"></div>
</div>

<div id="controls">
  <button id="btnDraw" data-i18n="draw"></button>
  <button id="btnNewGroup" data-i18n="newGroup"></button>
  <button id="btnReset" data-i18n="reset"></button>
  <button id="btnEnd" class="primary" data-i18n="endTurn"></button>
</div>

<div id="toast"></div>

<!-- ============ SETUP ============ -->
<div id="setup" class="overlay">
  <div class="modal">
    <div class="setup-head">
      <h1 style="margin:0">RUMMIKUB</h1>
      <select id="selLang">
        <option value="en">English</option>
        <option value="zhTW">繁體中文</option>
        <option value="zhCN">简体中文</option>
      </select>
    </div>

    <div class="field">
      <label data-i18n="yourName"></label>
      <input id="inputName" maxlength="12" autocomplete="off">
    </div>

    <div class="modes">
      <button class="modeBtn sel" data-mode="single">
        <span class="modeIcon">🤖</span><span data-i18n="singlePlayer"></span>
      </button>
      <button class="modeBtn" data-mode="local">
        <span class="modeIcon">👥</span><span data-i18n="passAndPlay"></span>
      </button>
      <button class="modeBtn" data-mode="online">
        <span class="modeIcon">🌐</span><span data-i18n="onlineRoom"></span>
      </button>
    </div>

    <div id="lobby" class="lobby hidden">
      <div id="lobbyChoice">
        <div class="lobby-actions">
          <button id="btnCreate" data-i18n="createRoom"></button>
          <button id="btnJoin" data-i18n="joinRoom"></button>
        </div>
      </div>
      <div id="joinBox" class="joinBox hidden">
        <input id="inputCode" maxlength="6" placeholder="ABC123" autocomplete="off">
        <button id="btnJoinGo" class="mini" style="padding:11px 18px" data-i18n="join"></button>
      </div>
      <div id="roomBox" class="hidden">
        <div class="codeRow">
          <span class="codeLabel" data-i18n="roomCode"></span>
          <span id="codeDisplay" class="code">------</span>
          <button id="btnCopy" class="mini" data-i18n="copy"></button>
        </div>
        <div class="shareRow" id="shareRow"></div>
        <div class="lobbyPlayers" id="lobbyPlayers"></div>
        <button id="btnStart" class="primary" data-i18n="startGame"></button>
      </div>
      <div id="statusMsg" class="statusMsg"></div>
    </div>

    <button id="btnRules" class="ghost" data-i18n="howToPlay"></button>
    <button id="btnPlay" class="primary" data-i18n="play"></button>
  </div>
</div>

<!-- ============ RULES ============ -->
<div id="rulesOverlay" class="overlay hidden">
  <div class="modal">
    <h2 data-i18n="rulesTitle"></h2>
    <div id="rulesBody"></div>
    <button class="primary" id="btnCloseRules" data-i18n="close"></button>
  </div>
</div>

<!-- ============ READY GATE ============ -->
<div id="readyOverlay" class="overlay hidden">
  <div class="modal">
    <h2 id="readyName"></h2>
    <p id="readyText" style="text-align:center"></p>
    <button class="primary" id="btnReady" data-i18n="ready"></button>
  </div>
</div>

<!-- ============ END GAME ============ -->
<div id="endOverlay" class="overlay hidden">
  <div class="modal" id="endContent"></div>
</div>

<script>
/* =========================================================
   1.  I18N
   ========================================================= */
const I18N = {
  en:{
    menu:'Menu', yourName:'Your name', language:'Language',
    singlePlayer:'Single Player', passAndPlay:'Pass & Play', onlineRoom:'Online Room',
    createRoom:'Create Room', joinRoom:'Join Room', join:'Join', roomCode:'Room code',
    copy:'Copy', copied:'Copied!', startGame:'Start Game', howToPlay:'How to Play',
    play:'Play', close:'Close', ready:'Ready',
    sort:'Sort', sortColor:'Colour', sortNumber:'Number', sortGroup:'Groups',
    draw:'Draw Tile', newGroup:'New Group', reset:'Reset Turn', endTurn:'End Turn',
    yourHand:'Your hand', firstMove:'Your hand  •  first move needs 30+ points',
    thinking:'is thinking…', turnEnding:'Turn ending…', gameOver:'Game over',
    pool:'Pool', theTableEmpty:'The table is empty — open with 30+ points',
    hintsOn:'Hints ON', hintsOff:'Hints OFF',
    turns:'Turns', time:'Time', timeShort:'Time', totalTime:'Total time',
    rulesTitle:'How to Play Rummikub',
    rulesBody:`<ul>
      <li><b>Goal:</b> be the first to place all your tiles on the table.</li>
      <li><b>Tiles:</b> 106 tiles — two sets of 1–13 in four colours, plus 2 jokers. Everyone starts with 14 tiles.</li>
      <li><b>Valid groups:</b> a <i>set</i> (3–4 tiles of the same number, different colours) or a <i>run</i> (3+ consecutive numbers, all the same colour).</li>
      <li><b>Jokers</b> can stand in for any tile. A joker used in a set/run may be swapped out later.</li>
      <li><b>First move:</b> you must place tiles from your hand worth at least <b>30 points</b> (a joker counts as 30). You may not use tiles already on the table for your first move.</li>
      <li><b>Your turn:</b> play tiles from your hand and/or rearrange the table, then press <i>End Turn</i>. Or press <i>Draw Tile</i> — you take one tile and your turn ends automatically.</li>
      <li><b>Rearranging:</b> you may move and reuse tiles already on the table, but every group must be valid at the end of your turn. Press <i>Reset Turn</i> to undo everything you did this turn.</li>
      <li><b>Taking back:</b> any tile you placed this turn shows a red × — click it to return that tile to your hand.</li>
      <li><b>Winning:</b> the first player to empty their hand wins. Everyone else scores the total value of the tiles left in their hand (joker = 30).</li>
    </ul>`,
    wins:'wins!', roundScore:'Score for the round', tiles:'tiles', pts:'pts',
    poolEmpty:'Pool exhausted — %s has the lowest hand', newGame:'New Game',
    invalidGroup:'Some group on the table is not valid.',
    mustPlay:'You must play at least one tile from your hand.',
    noFirstTable:'Your first move cannot use tiles already on the table.',
    needThirty:'First move must be worth at least 30 points (it is %s).',
    alreadyDrew:'You already drew / played this turn.',
    poolIsEmpty:'The pool is empty.',
    drewAuto:'Drew a tile — turn passed automatically',
    enterCode:'Enter a 6-character room code.',
    connecting:'Connecting…', connected:'Connected! Waiting for host…',
    roomCreated:'Room created. Share the code!',
    waitingPlayers:'Waiting for players… (AI fills empty seats)',
    hostLeft:'Host disconnected.', connLost:'Connection lost.',
    you:'You', host:'Host', guest:'Guest',
    onlineUnavailable:'Online play needs an internet connection.',
    enterName:'Please enter your name.',
    shareEmail:'Email', shareSms:'SMS', shareWhatsApp:'WhatsApp',
    shareTelegram:'Telegram', shareWeChat:'WeChat', shareNative:'Share…',
    wechatCopy:'Code copied — paste it into WeChat!',
    passDevice:'Pass the device to'
  },
  zhTW:{
    menu:'選單', yourName:'你的名稱', language:'語言',
    singlePlayer:'單人遊戲', passAndPlay:'輪流遊玩', onlineRoom:'線上房間',
    createRoom:'建立房間', joinRoom:'加入房間', join:'加入', roomCode:'房間代碼',
    copy:'複製', copied:'已複製！', startGame:'開始遊戲', howToPlay:'遊戲規則',
    play:'開始', close:'關閉', ready:'準備好了',
    sort:'排序', sortColor:'顏色', sortNumber:'數字', sortGroup:'組合',
    draw:'抽一張牌', newGroup:'新組合', reset:'重設回合', endTurn:'結束回合',
    yourHand:'你的手牌', firstMove:'你的手牌  •  首次出牌需 30 點以上',
    thinking:'思考中…', turnEnding:'回合結束中…', gameOver:'遊戲結束',
    pool:'牌堆', theTableEmpty:'桌面是空的 — 首次出牌需 30 點以上',
    hintsOn:'提示：開', hintsOff:'提示：關',
    turns:'回合數', time:'時間', timeShort:'時間', totalTime:'總時間',
    rulesTitle:'Rummikub 遊戲規則',
    rulesBody:`<ul>
      <li><b>目標：</b>最快將手上所有牌放到桌面上。</li>

/* =========================================================
   2.  TILES & GROUP LOGIC
   ========================================================= */
const COLORS = ['red','blue','yellow','black'];
const COLOR_INDEX = {red:0,blue:1,yellow:2,black:3,joker:4};
const PALETTE = ['#4fc3f7','#ff8a65','#aed581','#ba68c8'];
let _uid = 1;
const clone = o => JSON.parse(JSON.stringify(o));
const makeTile = (color,num) => ({ id:_uid++, color, num });

function createTiles(){
  const pool = [];
  for (let s=0;s<2;s++)
    for (const c of COLORS)
      for (let n=1;n<=13;n++) pool.push(makeTile(c,n));
  pool.push(makeTile('joker',0));
  pool.push(makeTile('joker',0));
  return pool;
}
function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function resolveGroup(tiles){
  if (!tiles || tiles.length < 3) return null;
  const jokers = tiles.filter(x=>x.color==='joker');
  const norm   = tiles.filter(x=>x.color!=='joker');
  if (!norm.length) return null;
  const n = tiles.length;

  const numSet   = new Set(norm.map(x=>x.num));
  const colorSet = new Set(norm.map(x=>x.color));
  if (numSet.size === 1 && colorSet.size === norm.length && n <= 4){
    const num = norm[0].num, byColor = {};
    norm.forEach(x=>byColor[x.color]=x);
    const jk = jokers.slice(), ordered=[], values=[];
    for (const c of COLORS){
      if (byColor[c]){ ordered.push(byColor[c]); values.push(num); }
      else if (jk.length){ ordered.push(jk.pop()); values.push(num); }
    }
    return { type:'set', ordered, values };
  }
  if (colorSet.size === 1){
    const ns = norm.map(x=>x.num);
    if (new Set(ns).size === ns.length){
      const mn=Math.min(...ns), mx=Math.max(...ns);
      const lo=Math.max(mx-n+1,1), hi=Math.min(mn,13-n+1);
      if (lo<=hi){
        const s=hi, byNum={};
        norm.forEach(x=>byNum[x.num]=x);
        const jk=jokers.slice(), ordered=[], values=[];
        for (let v=s; v<s+n; v++){
          if (byNum[v]){ ordered.push(byNum[v]); values.push(v); }
          else { ordered.push(jk.pop()); values.push(v); }
        }
        return { type:'run', ordered, values };
      }
    }
  }
  return null;
}
const groupValue = tiles => { const r=resolveGroup(tiles); return r ? r.values.reduce((a,b)=>a+b,0) : 0; };

function partialCompatible(a,b){
  if (!a || !b) return false;
  if (a.color==='joker' || b.color==='joker') return true;
  if (a.num===b.num && a.color!==b.color) return true;
  if (a.color===b.color && a.num!==b.num && Math.abs(a.num-b.num)<=2) return true;
  return false;
}

  if (MODE === 'local') return G.cur;
  if (MODE === 'online-client') return MY_INDEX;

function fmtTime(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(total/60);
  const s = total % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function elapsedMs(){
  if (!G || !G.startTime) return 0;
  const end = G.endTime || Date.now();
  return end - G.startTime;
}
function updateTimer(){
  const el = document.getElementById('timerInfo');
  if (!el) return;
  if (!G || !G.startTime){ el.textContent = '⏱ 00:00'; return; }
  el.textContent = '⏱ ' + fmtTime(elapsedMs());
}
function startTimer(){
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(updateTimer, 1000);
  updateTimer();
}
function stopTimer(){
  if (timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  updateTimer();
}

/* =========================================================
   5.  GAME SETUP
   ========================================================= */
function startGame(defs){
  _uid = 1;
  const pool = shuffle(createTiles());
  G = {
    pool, table: [],
    players: defs.map((d,i)=>({
      name: d.name, isAI: !!d.isAI, hand: [], melded: false,
      color: PALETTE[i], turns: 0
    })),
    cur: 0, drawnThisTurn:false, drawnTile:null,
    passStreak:0, gameOver:false, locked:false, snapshot:null,
    startTime: Date.now(), endTime: null
  };
  for (let i=0;i<14;i++) for (const p of G.players) p.hand.push(G.pool.pop());
  SEL.clear();
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('setup').classList.add('hidden');
  startTimer();
  startTurn();
}

/* =========================================================
   6.  TURN FLOW
   ========================================================= */
function startTurn(){
  SEL.clear();
  G.drawnThisTurn = false;
  G.drawnTile = null;
  G.locked = false;
  /* count this turn against the current player */
  if (curP()) curP().turns = (curP().turns || 0) + 1;
  G.snapshot = { table: clone(G.table), hand: clone(curP().hand) };

  if (MODE === 'local' && !curP().isAI) AWAIT_READY = true;
  else AWAIT_READY = false;

  render();
  broadcast();
  if (MODE === 'local' && AWAIT_READY) showReady();
  else maybeAI();
}

function maybeAI(){
  if (!G || G.gameOver) return;
  if (MODE === 'online-client') return;
  if (curP().isAI) setTimeout(aiTurn, 850);
}

function nextTurn(){
  G.cur = (G.cur + 1) % G.players.length;
  startTurn();
}

function snapshotTableIds(){
  const s = new Set();
  if (G.snapshot) for (const g of G.snapshot.table) for (const x of g.tiles) s.add(x.id);
  return s;
}
function snapshotGroupKeys(){
  const s = new Set();
  if (G.snapshot) for (const g of G.snapshot.table)
    s.add(g.tiles.map(x=>x.id).sort((a,b)=>a-b).join(','));
  return s;
}
function tilesPlayedThisTurn(){
  const before = snapshotTableIds(), out = [];
  for (const g of G.table) for (const x of g.tiles) if (!before.has(x.id)) out.push(x.id);
  return out;
}

/* =========================================================
   7.  ACTIONS
   ========================================================= */
function requestAction(a){
  if (MODE === 'online-client'){
    if (conn && conn.open) conn.send({ t:'action', action:a });
    return;
  }
  applyAction(a);
}
function applyAction(a){
  if (!G || G.gameOver) return;
  switch(a.type){
    case 'move':     doMove(a.ids, a.target); break;
    case 'takeBack': doTakeBack(a.id);        break;
    case 'newGroup': doMove(a.ids, null);     break;
    case 'draw':     doDraw();                break;
    case 'endTurn':  doEndTurn();             break;
    case 'reset':    doReset();               break;
  }
  broadcast();
}
function doMove(ids, targetId){
  const p = curP(), moving = [];
  for (const g of G.table){
    const keep = [];
    for (const x of g.tiles){ if (ids.includes(x.id)) moving.push(x); else keep.push(x); }
    g.tiles = keep;
  }
  G.table = G.table.filter(g=>g.tiles.length>0);
  p.hand = p.hand.filter(x=>{
    if (ids.includes(x.id)){ moving.push(x); return false; }
    return true;
  });
  if (!moving.length) return;
  let target = null;
  if (targetId !== null && targetId !== undefined) target = G.table.find(g=>g.id===targetId);
  if (!target){ target = { id:_uid++, tiles:[] }; G.table.push(target); }
  target.tiles.push(...moving);
  const r = resolveGroup(target.tiles);
  if (r) target.tiles = r.ordered;
  SEL.clear();
  render();
}
function doTakeBack(id){
  if (snapshotTableIds().has(id)) return;
  let found = null;
  for (const g of G.table){
    const i = g.tiles.findIndex(x=>x.id===id);
    if (i>=0){ found = g.tiles.splice(i,1)[0]; break; }
  }
  if (!found) return;
  G.table = G.table.filter(g=>g.tiles.length>0);
  curP().hand.push(found);
  SEL.delete(id);
  render();
}
function doDraw(){
  if (!canActHost()) return;
  if (G.drawnThisTurn || tilesPlayedThisTurn().length){ toast(t('alreadyDrew')); return; }
  if (!G.pool.length){ toast(t('poolIsEmpty')); return; }
  const tile = G.pool.pop();
  curP().hand.push(tile);
  G.drawnThisTurn = true;
  G.drawnTile = tile;
  G.locked = true;
  render();
  toast(t('drewAuto'), true);
  setTimeout(()=>{
    if (!G || G.gameOver) return;
    G.locked = false;
    passTurn();
  }, 750);
}
function canActHost(){
  if (!G || G.gameOver || G.locked) return false;
  if (MODE === 'online-client') return false;
  const i = viewIndex();
  if (MODE === 'local') return !G.players[i].isAI && !AWAIT_READY;
  return G.cur === 0;
}
function doReset(){
  if (!canActHost()) return;
  const p = curP();
  G.table = clone(G.snapshot.table);
  p.hand  = clone(G.snapshot.hand);
  if (G.drawnTile) G.pool.push(G.drawnTile);
  G.drawnThisTurn = false;
  G.drawnTile = null;
  SEL.clear();
  render();
}
function validateTurn(){
  const p = curP(), errs = [];
  for (const g of G.table)
    if (!resolveGroup(g.tiles)) errs.push(t('invalidGroup'));
  if (tilesPlayedThisTurn().length === 0) errs.push(t('mustPlay'));
  if (!p.melded){
    const beforeIds  = snapshotTableIds();
    const beforeKeys = snapshotGroupKeys();
    let sum = 0, touched = false;
    for (const g of G.table){
      const key = g.tiles.map(x=>x.id).sort((a,b)=>a-b).join(',');
      if (beforeKeys.has(key)) continue;
      if (g.tiles.some(x=>beforeIds.has(x.id))) touched = true;
      sum += groupValue(g.tiles);
    }
    if (touched) errs.push(t('noFirstTable'));
    if (sum < 30) errs.push(t('needThirty').replace('%s', sum));
  }
  return [...new Set(errs)];
}
function doEndTurn(){
  if (!canActHost()) return;
  const p = curP();
  if (tilesPlayedThisTurn().length === 0){
    G.table = clone(G.snapshot.table);
    SEL.clear();
    if (!G.drawnThisTurn && G.pool.length) p.hand.push(G.pool.pop());
    G.drawnThisTurn = false;
    G.drawnTile = null;
    render();
    passTurn();
    return;
  }
  const errs = validateTurn();
  if (errs.length){ toast(errs[0]); return; }
  if (!p.melded) p.melded = true;
  G.table.forEach(g=>{ const r = resolveGroup(g.tiles); if (r) g.tiles = r.ordered; });
  G.table = G.table.filter(g=>g.tiles.length>0);
  SEL.clear();
  G.passStreak = 0;
  if (p.hand.length === 0){ render(); broadcast(); endGame(G.cur); return; }
  nextTurn();
}
function passTurn(){
  if (G.pool.length === 0) G.passStreak++; else G.passStreak = 0;
  if (G.passStreak >= G.players.length){ render(); broadcast(); endGame(-1); return; }
  nextTurn();
}

/* =========================================================
   8.  SORTING
   ========================================================= */
function colorSort(a,b){
  const ca=COLOR_INDEX[a.color], cb=COLOR_INDEX[b.color];
  if (ca!==cb) return ca-cb;
  return a.num-b.num;
}
function numberSort(a,b){
  const na = a.color==='joker'?99:a.num, nb = b.color==='joker'?99:b.num;
  if (na!==nb) return na-nb;
  return COLOR_INDEX[a.color]-COLOR_INDEX[b.color];
}
function groupChunks(hand){
  const jokers  = hand.filter(x=>x.color==='joker');
  const normals = hand.filter(x=>x.color!=='joker');
  const used = new Set(), groups = [], jkPool = jokers.slice();
  const byNum = new Map();
  for (const x of normals){ if (!byNum.has(x.num)) byNum.set(x.num,[]); byNum.get(x.num).push(x); }
  for (const num of [...byNum.keys()].sort((a,b)=>a-b)){
    const list = byNum.get(num).filter(x=>!used.has(x.id));
    const seen = new Set(), uniq = [];
    for (const x of list){ if (seen.has(x.color)) continue; seen.add(x.color); uniq.push(x); }
    if (uniq.length>=3){
      const g = uniq.slice(0,4);
      g.forEach(x=>used.add(x.id));
      groups.push({ tiles:g, num });
    }
  }
  for (const c of COLORS){
    const list = normals.filter(x=>x.color===c && !used.has(x.id)).sort((a,b)=>a.num-b.num);
    const seen = new Set(), uniq = [];
    for (const x of list){ if (seen.has(x.num)) continue; seen.add(x.num); uniq.push(x); }
    let i=0;
    while (i<uniq.length){
      let j=i;
      while (j+1<uniq.length && uniq[j+1].num===uniq[j].num+1) j++;
      if (j-i+1>=3){
        const g = uniq.slice(i,j+1);
        g.forEach(x=>used.add(x.id));
        groups.push({ tiles:g, num:g[0].num });
        i=j+1;
      } else i++;
    }
  }
  for (const num of [...byNum.keys()].sort((a,b)=>a-b)){
    const list = byNum.get(num).filter(x=>!used.has(x.id));
    if (list.length===2 && jkPool.length){
      const jk = jkPool.shift(), g = [...list, jk];
      g.forEach(x=>used.add(x.id));
      groups.push({ tiles:g, num });
    }
  }
  for (const c of COLORS){
    const list = normals.filter(x=>x.color===c && !used.has(x.id)).sort((a,b)=>a.num-b.num);
    for (let i=0;i+1<list.length;i++){
      const a=list[i], b=list[i+1];
      if (used.has(a.id)||used.has(b.id)) continue;
      if (b.num===a.num+1 && jkPool.length){
        const jk = jkPool.shift(), g = [a,b,jk];
        g.forEach(x=>used.add(x.id));
        groups.push({ tiles:g, num:a.num });
      }
    }
  }
  const rest = hand.filter(x=>!used.has(x.id)).sort(colorSort);
  groups.sort((a,b)=> b.tiles.length-a.tiles.length || a.num-b.num);
  const chunks = groups.map(g=>g.tiles);
  if (rest.length) chunks.push(rest);
  return chunks.length ? chunks : [[]];
}
function sortHand(hand, mode){
  if (mode === 'group') return groupChunks(hand);
  return [hand.slice().sort(mode === 'number' ? numberSort : colorSort)];
}

/* =========================================================
   9.  HINTS
   ========================================================= */
function computeHints(){
  const res = { hand:new Set(), groups:new Set() };
  if (!HINTS || !G || SEL.size !== 1) return res;
  const selId = [...SEL][0];
  let sel = null;
  for (const x of humanP().hand) if (x.id===selId) sel = x;
  for (const g of G.table) for (const x of g.tiles) if (x.id===selId) sel = x;
  if (!sel) return res;
  for (const x of humanP().hand){
    if (x.id===selId) continue;
    if (partialCompatible(sel, x)) res.hand.add(x.id);
  }
  for (const g of G.table){
    if (g.tiles.some(x=>x.id===selId)) continue;
    if (resolveGroup(g.tiles.concat([sel]))) res.groups.add(g.id);
  }
  return res;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =========================================================
   11. AI
   ========================================================= */
function genCandidates(hand){
  const out = [], n = hand.length, maxK = n<=15 ? 7 : 5, cur = [];
  function comb(start,k){
    if (cur.length===k){
      const tiles = cur.map(i=>hand[i]);
      const r = resolveGroup(tiles);
      if (r) out.push({ tiles, value:r.values.reduce((a,b)=>a+b,0) });
      return;
    }
    for (let i=start;i<n;i++){ cur.push(i); comb(i+1,k); cur.pop(); }
  }
  for (let k=3;k<=maxK && k<=n;k++) comb(0,k);
  return out;
}
function searchMeld(cands, minValue){
  const map = new Map();
  for (const c of cands){
    const key = c.tiles.map(x=>x.id).sort((a,b)=>a-b).join('-');
    if (!map.has(key)) map.set(key,c);
  }
  let list = [...map.values()];
  list.sort((a,b)=> b.tiles.length-a.tiles.length || b.value-a.value);
  if (list.length>140) list = list.slice(0,140);
  const score = (combo,value)=>{
    let tiles=0, jok=0;
    for (const c of combo){
      tiles += c.tiles.length;
      jok += c.tiles.filter(x=>x.color==='joker').length;
    }
    return tiles*1000 + value - jok*150;
  };
  let bestAny={score:-Infinity,combo:null}, bestMin={score:-Infinity,combo:null};
  const used = new Set(); let nodes=0; const LIMIT=40000;
  function dfs(i,combo,value){
    if (nodes++ > LIMIT) return;
    const s = score(combo,value);
    if (s>bestAny.score) bestAny = {score:s, combo:combo.slice()};
    if (value>=minValue && s>bestMin.score) bestMin = {score:s, combo:combo.slice()};
    if (i>=list.length) return;
    for (let j=i;j<list.length;j++){
      const c = list[j];
      let ok = true;
      for (const x of c.tiles) if (used.has(x.id)){ ok=false; break; }
      if (!ok) continue;
      for (const x of c.tiles) used.add(x.id);
      combo.push(c);
      dfs(j+1, combo, value+c.value);
      combo.pop();
      for (const x of c.tiles) used.delete(x.id);
      if (nodes>LIMIT) return;
    }
  }
  dfs(0,[],0);
  const res = minValue>0 ? bestMin.combo : bestAny.combo;
  return (res && res.length) ? res : null;
}
function aiTurn(){
  if (!G || G.gameOver) return;
  if (MODE === 'online-client') return;
  const p = curP();
  if (!p.isAI) return;
  let played = false;

  if (!p.melded){
    const combo = searchMeld(genCandidates(p.hand), 30);
    if (combo){
      for (const c of combo){
        c.tiles.forEach(x=>{
          const i = p.hand.findIndex(y=>y.id===x.id);
          if (i>=0) p.hand.splice(i,1);
        });
        G.table.push({ id:_uid++, tiles:c.tiles.slice() });
      }
      p.melded = true; played = true;
    }
  } else {
    let changed = true;
    while (changed){
      changed = false;
      outer:
      for (const g of G.table){
        for (let i=0;i<p.hand.length;i++){
          const x = p.hand[i];
          if (x.color==='joker') continue;
          const r = resolveGroup(g.tiles.concat([x]));
          if (r){ g.tiles = r.ordered; p.hand.splice(i,1); played=true; changed=true; break outer; }
        }
      }
    }
    if (p.hand.length >= 3){
      const combo = searchMeld(genCandidates(p.hand), 0);
      if (combo){
        for (const c of combo){
          c.tiles.forEach(x=>{
            const i = p.hand.findIndex(y=>y.id===x.id);
            if (i>=0) p.hand.splice(i,1);
          });
          G.table.push({ id:_uid++, tiles:c.tiles.slice() });
        }
        played = true;
      }
    }
  }

  if (played){
    G.passStreak = 0;
    G.table.forEach(g=>{ const r=resolveGroup(g.tiles); if (r) g.tiles=r.ordered; });
    if (p.hand.length === 0){ render(); broadcast(); endGame(G.cur); return; }
    render(); broadcast();
    setTimeout(nextTurn, 700);
  } else {
    if (G.pool.length) p.hand.push(G.pool.pop());
    G.passStreak = G.pool.length===0 ? G.passStreak+1 : 0;
    render(); broadcast();
    if (G.passStreak >= G.players.length){ endGame(-1); return; }
    setTimeout(nextTurn, 500);
  }
}

function handValue(hand){

  for (const x of hand) v += (x.color==='joker' ? 30 : x.num);

}
function endGame(winner){
  G.gameOver = true;
  G.endTime = Date.now();
  SEL.clear();
  stopTimer();
  render(); broadcast();

  const totalMs = elapsedMs();
  const totalTimeStr = fmtTime(totalMs);

  let title, body='';
  if (winner >= 0){
    const w = G.players[winner];
    let total = 0;
    for (let i=0;i<G.players.length;i++) if (i!==winner) total += handValue(G.players[i].hand);
    title = esc(w.name) + ' ' + t('wins');
    body = `<p style="text-align:center">${t('roundScore')}: <b>${total}</b> ${t('pts')}</p>`;
  } else {
    let best = 0;
    for (let i=1;i<G.players.length;i++)
      if (handValue(G.players[i].hand) < handValue(G.players[best].hand)) best = i;
    title = t('poolEmpty').replace('%s', esc(G.players[best].name));
  }

  const rows = G.players.map((p,i)=>
    `<tr>
       <td><span class="dot" style="background:${p.color};display:inline-block;margin-right:8px"></span>${esc(p.name)}</td>
       <td class="num">${p.turns||0} ${t('turns')}</td>
       <td class="num">${p.hand.length} ${t('tiles')}</td>
       <td class="num">${handValue(p.hand)} ${t('pts')}</td>
     </tr>`).join('');

  document.getElementById('endContent').innerHTML =
    `<h2>${title}</h2>${body}
     <p style="text-align:center;opacity:.7;margin:6px 0 0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase">${t('totalTime')}</p>
     <div class="timeBig">${totalTimeStr}</div>
     <table>${rows}</table>
     <button class="primary" id="btnEndNew">${t('newGame')}</button>`;
  document.getElementById('endOverlay').classList.remove('hidden');
  document.getElementById('btnEndNew').onclick = ()=> location.reload();
}

function loadPeerJS(cb){
  if (window.Peer) return cb(true);
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload  = ()=> cb(true);
  s.onerror = ()=> cb(false);
  document.head.appendChild(s);
}
function genCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i=0;i<6;i++) s += A[(Math.random()*A.length)|0];
  return s;
}
function broadcast(){
  if (MODE !== 'online-host') return;
  for (const c of conns){
    if (c.conn && c.conn.open){
      try { c.conn.send({ t:'state', state:G, you:c.index }); } catch(e){}
    }
  }
}
function hostStart(){
  loadPeerJS(ok=>{
    if (!ok){ setStatus(t('onlineUnavailable'), 'err'); return; }
    roomCode = genCode();
    setStatus(t('connecting'));
    peer = new Peer(PEER_PREFIX + roomCode, { debug:1 });
    peer.on('open', ()=>{
      document.getElementById('codeDisplay').textContent = roomCode;
      document.getElementById('roomBox').classList.remove('hidden');
      document.getElementById('lobbyChoice').classList.add('hidden');
      document.getElementById('joinBox').classList.add('hidden');
      setStatus(t('roomCreated'), 'ok');
      renderLobby();
      buildShare();
    });
    peer.on('error', e=> setStatus('Error: ' + e.type, 'err'));
    peer.on('connection', c=>{
      c.on('open', ()=>{
        if (conns.length >= 3){ c.send({t:'full'}); setTimeout(()=>c.close(), 300); return; }
        const idx = conns.length + 1;
        conns.push({ conn:c, index:idx, name:t('guest')+' '+idx });
        c.on('data', d=>{
          if (d.t === 'hello'){ conns.find(x=>x.conn===c).name = d.name; renderLobby(); }
          if (d.t === 'action') applyAction(d.action);
        });
        c.on('close', ()=>{ conns = conns.filter(x=>x.conn!==c); renderLobby(); });
        renderLobby();
      });
    });
  });
}
function guestJoin(code){
  loadPeerJS(ok=>{
    if (!ok){ setStatus(t('onlineUnavailable'), 'err'); return; }
    setStatus(t('connecting'));
    peer = new Peer({ debug:1 });
    peer.on('open', ()=>{
      conn = peer.connect(PEER_PREFIX + code, { reliable:true });
      conn.on('open', ()=>{
        conn.send({ t:'hello', name: myName() });
        setStatus(t('connected'), 'ok');
      });
      conn.on('data', d=>{
        if (d.t === 'state'){
          G = d.state;
          MY_INDEX = d.you;
          MODE = 'online-client';
          document.getElementById('setup').classList.add('hidden');
          document.getElementById('endOverlay').classList.add('hidden');
          /* keep timer running on client side based on host's startTime */
          if (G.startTime){ startTimer(); }
          render();
        }
        if (d.t === 'full') setStatus('Room is full.', 'err');
      });
      conn.on('close', ()=>{ setStatus(t('hostLeft'), 'err'); toast(t('hostLeft')); });
      conn.on('error', ()=> setStatus(t('connLost'), 'err'));
    });
    peer.on('error', e=> setStatus('Error: ' + e.type, 'err'));
  });
}

    { k:'shareSms',      icon:'💬',  href:`sms:?&body=${text}${u}` },
    { k:'shareWhatsApp', icon:'🟢',  href:`https://wa.me/?text=${text}${u}` },

  el.textContent = msg;
  el.className = 'show' + (good ? ' good' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = ''; }, 2600);
}

/* =========================================================
   16. INIT
   ========================================================= */
(function init(){
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('zh')){
    LANG = (nav.includes('tw') || nav.includes('hk') || nav.includes('hant')) ? 'zhTW' : 'zhCN';
  } else LANG = 'en';
  document.getElementById('selLang').value = LANG;
  document.getElementById('inputName').value = LANG === 'en' ? 'You' : t('you');

  const hash = location.hash.replace('#','').trim().toUpperCase();
  if (hash.length === 6){
    document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('sel'));
    const ob = document.querySelector('.modeBtn[data-mode="online"]');
    ob.classList.add('sel'); chosenMode = 'online';
    document.getElementById('lobby').classList.remove('hidden');
    document.getElementById('lobbyChoice').classList.add('hidden');
    document.getElementById('joinBox').classList.remove('hidden');
    document.getElementById('inputCode').value = hash;
  }

  applyLang();
  updateTimer();
})();
</script>
</body>
